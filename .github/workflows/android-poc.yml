name: android-poc

on:
  workflow_dispatch:
  push:
    branches: [android-poc]
    paths: ["android_poc/**"]

concurrency:
  group: android-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: android_poc

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for NDK and build artifacts
        working-directory: .
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android_poc/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer

      - name: Build debug APK
        run: buildozer android debug -v

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stkpoc-apk
          path: android_poc/bin/*.apk

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: android_poc/build.log
