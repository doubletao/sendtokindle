name: android-poc

on:
  workflow_dispatch:
  push:
    branches: [android-poc]
    paths:
      - "android_poc/**"
      - ".github/workflows/android-poc.yml"

concurrency:
  group: android-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: android_poc

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for NDK and build artifacts
        working-directory: .
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # libltdl-dev provides the LT_SYS_SYMBOL_USCORE macro needed by the
      # libffi recipe's autogen.sh; ubuntu runners do not ship it by default.
      - name: Install native build tools
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libltdl-dev autoconf automake libtool pkg-config
          df -h /

      - name: Restore buildozer cache
        uses: actions/cache/restore@v4
        id: buildozer-cache
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android_poc/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer

      # -v is a global flag of this buildozer version and must precede the
      # subcommand; trailing position yields "Unknown command -v" (exit 1)
      # after the APK was already produced.
      - name: Build debug APK
        run: buildozer -v android debug

      - name: Save buildozer cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.buildozer
          key: ${{ steps.buildozer-cache.outputs.cache-primary-key }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stkpoc-apk
          path: android_poc/bin/*.apk

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: android_poc/build.log
